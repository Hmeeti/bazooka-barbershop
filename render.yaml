services:
  - type: web
    name: bazooka-barbershop
    runtime: node
    plan: free
    region: frankfurt
    branch: master
    autoDeploy: true
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: bazooka-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: APP_URL
        value: https://bazooka-barbershop.onrender.com

databases:
  - name: bazooka-db
    plan: free
    region: frankfurt
    databaseName: bazooka
    user: bazooka
